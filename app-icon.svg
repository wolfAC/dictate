<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <!-- Source for every app icon: `pnpm tauri icon app-icon.svg`.
       Follows Apple's grid: an 824px rounded square centred on a 1024px canvas. -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#7C6CFF"/>
      <stop offset="0.55" stop-color="#5B45F0"/>
      <stop offset="1" stop-color="#3A22B8"/>
    </linearGradient>
    <linearGradient id="sheen" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.22"/>
      <stop offset="0.5" stop-color="#FFFFFF" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="bar" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="1" stop-color="#E4DEFF"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="125%">
      <feDropShadow dx="0" dy="14" stdDeviation="16" flood-color="#1B0F5C" flood-opacity="0.35"/>
    </filter>
    <filter id="barShadow" x="-50%" y="-20%" width="200%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#21107A" flood-opacity="0.35"/>
    </filter>
  </defs>

  <g filter="url(#shadow)">
    <rect x="100" y="100" width="824" height="824" rx="186" fill="url(#bg)"/>
  </g>
  <rect x="100" y="100" width="824" height="824" rx="186" fill="url(#sheen)"/>
  <rect x="101" y="101" width="822" height="822" rx="185" fill="none" stroke="#FFFFFF" stroke-opacity="0.12" stroke-width="2"/>

  <!-- Voice bars, like the "Listening" overlay: 5 × 76px wide, 40px gaps, centred at 512. -->
  <g fill="url(#bar)" filter="url(#barShadow)">
    <rect x="242" y="412" width="76" height="200" rx="38"/>
    <rect x="358" y="322" width="76" height="380" rx="38"/>
    <rect x="474" y="242" width="76" height="540" rx="38"/>
    <rect x="590" y="322" width="76" height="380" rx="38"/>
    <rect x="706" y="412" width="76" height="200" rx="38"/>
  </g>
</svg>
