name: CI
on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest
          - platform: windows-latest
            bundles: msi,nsis
          - platform: ubuntu-22.04
            bundles: deb,rpm
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v7

      - name: Install Linux dependencies
        if: startsWith(matrix.platform, 'ubuntu')
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf \
            libasound2-dev libxdo-dev libssl-dev clang cmake

      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm

      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - run: pnpm install --frozen-lockfile
      - name: Type-check and build the UI
        run: pnpm build
      - name: Test
        working-directory: src-tauri
        run: cargo test --lib

      # Build the installers so packaging breaks show up before a release.
      # Update files need the signing key, which only release builds get.
      - name: Build installers
        if: matrix.bundles
        shell: bash
        run: >
          pnpm tauri build --ci --bundles ${{ matrix.bundles }}
          --config '{"bundle":{"createUpdaterArtifacts":false}}'
      - uses: actions/upload-artifact@v7
        if: matrix.bundles
        with:
          name: dictate-${{ runner.os }}
          path: |
            src-tauri/target/release/bundle/msi/*.msi
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/bundle/deb/*.deb
            src-tauri/target/release/bundle/rpm/*.rpm
